[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capego"
version = "0.1.0"
description = "Continuous egocentric capture and local dataset production"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["egocentric", "ego", "data-collection", "world-action-model", "dataset"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "numpy>=1.26,<3", "Pillow>=10,<13", "h5py>=3.11,<4",
  "imageio-ffmpeg>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/Auromix/capego"
Repository = "https://github.com/Auromix/capego"
Issues = "https://github.com/Auromix/capego/issues"

[project.optional-dependencies]
data = ["av>=14,<17", "scipy>=1.11,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
export = ["zarr==3.1.5"]
training = ["torch>=2.5,<3", "zarr==3.1.5", "simplejpeg", "pandas", "scipy", "boto3", "cloudpathlib", "sqlalchemy", "einops", "loguru", "matplotlib", "overrides"]
vlm = ["torch", "transformers>=4.57,<5", "accelerate", "lm-format-enforcer>=0.11,<1"]

[project.scripts]
capego = "capego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capego = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
